<script>
let scrapesData = [];
let selectedCategory = "sources";

const CATEGORIES = [
  "sources", "shared", "homelab-wiki", "personal-wiki",
  "ish-d", "real-estate", "dental-msp", "axiom-music"
];

const CATEGORY_LABELS = {
  "sources": "Sources", "shared": "Shared",
  "homelab-wiki": "homelab-wiki", "personal-wiki": "Personal",
  "ish-d": "Ish D", "real-estate": "Real Estate",
  "dental-msp": "Dental", "axiom-music": "Axiom"
};

// Navigation
function navigate(page) {
  const hashMap = {
    "home": "home", "recent": "recent", "library": "library",
    "categories": "categories", "tags": "tags", "stats": "stats",
    "activity": "activity", "settings": "settings",
    "import": "import", "vault": "vault", "memory": "memory",
    "jobs": "jobs", "system-status": "system-status"
  };
  window.location.hash = "#" + (hashMap[page] || page);

  document.querySelectorAll(".page").forEach(function(p) {
    p.classList.remove("active");
  });
  var target = document.getElementById("page-" + page);
  if (target) {
    target.classList.add("active");
  }
  document.querySelectorAll(".nav-item").forEach(function(n) {
    n.classList.remove("active");
    if (n.dataset.page === page) {
      n.classList.add("active");
    }
  });
  document.getElementById("breadcrumb").textContent = "Quarry / " + page;

  // Load page data
  if (page === "recent") loadRecent();
  else if (page === "library") loadLibrary();
  else if (page === "home") loadHome();
  else if (page === "categories") renderCategories();
  else if (page === "settings") loadSettings();
  else if (page === "system-status") loadSystemStatus();
  else if (page === "stats") loadStats();
  else if (page === "activity") loadActivity();
  else if (page === "tags") loadTags();
  else if (page === "import") loadImport();
  else if (page === "vault") loadVault();
  else if (page === "memory") loadMemory();
}

// Hash routing
function handleHash() {
  var hash = window.location.hash.slice(1) || "";
  if (hash.startsWith("/")) hash = hash.slice(1);
  var pageMap = {
    "": "home", "recent": "recent", "library": "library",
    "categories": "categories", "tags": "tags", "stats": "stats",
    "activity": "activity", "settings": "settings",
    "import": "import", "vault": "vault", "memory": "memory",
    "jobs": "jobs", "system-status": "system-status"
  };
  var page = pageMap[hash] || "home";
  navigate(page);
}

// Toast
function showToast(msg, type) {
  var c = document.getElementById("toast-container");
  var t = document.createElement("div");
  t.className = "toast toast-" + (type || "success");
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

// API
async function api(url, opts) {
  try {
    var r = await fetch(url, opts || {});
    return await r.json();
  } catch(e) {
    return { ok: false, error: String(e) };
  }
}

// NDJSON stream reader. api() parses one JSON body, which the streaming
// endpoints (/scrape, /api/batch-scrape) never send — use this for those.
async function streamNdjson(url, opts, onLine) {
  var r = await fetch(url, opts || {});
  if (!r.body) {
    var text = await r.text();
    text.split("\n").forEach(function(l) {
      if (l.trim()) { try { onLine(JSON.parse(l)); } catch(e) {} }
    });
    return;
  }
  var reader = r.body.getReader();
  var decoder = new TextDecoder();
  var buf = "";
  while (true) {
    var chunk = await reader.read();
    if (chunk.done) break;
    buf += decoder.decode(chunk.value, { stream: true });
    var parts = buf.split("\n");
    buf = parts.pop();
    parts.forEach(function(l) {
      if (l.trim()) { try { onLine(JSON.parse(l)); } catch(e) {} }
    });
  }
  if (buf.trim()) { try { onLine(JSON.parse(buf)); } catch(e) {} }
}

// Same extraction rules as the scraper and webui.
function extractVideoId(u) {
  var s = String(u || "").trim();
  var m = s.match(/(?:v=|\/v\/|youtu\.be\/|shorts\/|embed\/|live\/)([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/^([a-zA-Z0-9_-]{11})$/);
  return m ? m[1] : null;
}

function isYoutubeHost(u) {
  return /^(https?:\/\/)?([a-z0-9-]+\.)*(youtube\.com|youtu\.be)\//i.test(String(u || "").trim());
}

// "12m ago", "1h ago", "2d ago" from a unix timestamp in seconds.
// Counts by subtraction rather than division: check_js_balance.py reads a bare
// "/" as the start of a regex literal, so the script stays division-free.
var TIME_UNITS = [
  { n: 31536000, u: "y" },
  { n: 2592000, u: "mo" },
  { n: 86400, u: "d" },
  { n: 3600, u: "h" },
  { n: 60, u: "m" }
];

function timeAgo(ts) {
  var t = Number(ts) || 0;
  if (!t) return "—";
  var s = Math.floor(Date.now() * 0.001) - Math.floor(t);
  if (s < 0) s = 0;
  for (var i = 0; i < TIME_UNITS.length; i++) {
    var unit = TIME_UNITS[i];
    if (s < unit.n) continue;
    var count = 0;
    var rem = s;
    while (rem >= unit.n) { rem -= unit.n; count++; }
    return count + unit.u + " ago";
  }
  return s + "s ago";
}

// App settings (default destination + Ask Hermes target)
var appSettings = { default_category: "sources", hermes_webui_url: "http://192.168.1.22:8787" };
var settingsLoaded = false;

async function loadAppSettings(force) {
  if (settingsLoaded && !force) return appSettings;
  var d = await api("/api/settings");
  if (d && d.default_category) {
    appSettings = d;
    if (!settingsLoaded && CATEGORIES.indexOf(d.default_category) >= 0) {
      selectedCategory = d.default_category;
    }
  }
  settingsLoaded = true;
  return appSettings;
}

function hermesUrl() {
  return appSettings.hermes_webui_url || "http://192.168.1.22:8787";
}

// Build a /view/ URL, escaping each path segment but keeping the separators
function viewUrl(p) {
  return "/view/" + String(p || "").split("/").map(function(seg) {
    return encodeURIComponent(seg);
  }).join("/");
}

// "2026-07-31-some-video-title" -> "some video title"
function cleanFileTitle(name) {
  var t = String(name || "");
  t = t.replace(/^\d{4}-\d{2}-\d{2}[-_]?/, "");
  t = t.replace(/[-_]+/g, " ").trim();
  return t || String(name || "");
}

// Sidebar health footer — polls /api/health, red rows open a detail popover.
var healthData = null;
var healthOpen = null;
var HEALTH_SERVICES = [
  { key: "obsidian", label: "Obsidian" },
  { key: "hermes", label: "Hermes" },
  { key: "worker", label: "Worker" }
];

async function loadHealth() {
  var d = await api("/api/health");
  healthData = d && d.obsidian ? d : null;
  renderHealth();
}

function renderHealth() {
  var el = document.getElementById("sidebar-health");
  if (!el) return;
  var html = "";
  HEALTH_SERVICES.forEach(function(svc) {
    var s = (healthData && healthData[svc.key]) || { ok: false, detail: "unknown" };
    var color = s.ok ? "#22c55e" : "#f87171";
    html += "<div class='health-row" + (s.ok ? "" : " bad") + "'" +
      (s.ok ? "" : " onclick='toggleHealthDetail(\"" + svc.key + "\");event.stopPropagation()'") + ">";
    html += "<span class='health-dot' style='background:" + color + "'></span>";
    html += "<span>" + esc(svc.label) + "</span>";
    html += "</div>";
  });
  if (healthOpen) {
    var svc = null;
    HEALTH_SERVICES.forEach(function(x) { if (x.key === healthOpen) svc = x; });
    var s = (healthData && healthData[healthOpen]) || null;
    if (svc && s && !s.ok) {
      html += "<div class='health-pop'>";
      html += "<div class='hp-name'>" + esc(svc.label) + "</div>";
      html += "<div class='hp-detail'>" + esc(s.detail || "unavailable") + "</div>";
      html += "<button class='rt-act' onclick='closeHealthDetail();navigate(\"settings\")'>Open Settings</button>";
      html += "</div>";
    } else {
      healthOpen = null;
    }
  }
  el.innerHTML = html;
}

function toggleHealthDetail(key) {
  healthOpen = (healthOpen === key) ? null : key;
  renderHealth();
}

function closeHealthDetail() {
  healthOpen = null;
  renderHealth();
}

// Pills — the bucket selector. Shared by every scrape form on the page.
function renderPills(wrapId) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  wrap.innerHTML = "";
  CATEGORIES.forEach(function(cat) {
    var p = document.createElement("span");
    p.className = "pill" + (cat === selectedCategory ? " active" : "");
    p.textContent = CATEGORY_LABELS[cat] || cat;
    p.dataset.v = cat;
    p.onclick = function() { setSelectedCategory(cat, true); };
    wrap.appendChild(p);
  });
  applySuggestionRing();
}

function setSelectedCategory(cat, manual) {
  selectedCategory = cat;
  if (manual) clearSuggestion();
  document.querySelectorAll(".scrape-pills .pill").forEach(function(x) {
    x.className = "pill" + (x.dataset.v === cat ? " active" : "");
    x.style.boxShadow = "";
  });
  if (!manual) applySuggestionRing();
}

// ── Capture (Home) ─────────────────────────────────────────────
// Paste-time state. Reset whenever the typed URL changes.
var suggestedCategory = null;
var pasteDuplicate = null;
var pillTouched = false;
var checkTimer = null;
var lastCheckedUrl = "";

var STAGE_STEPS = [
  { label: "Extracting transcript" },
  { label: "Creating note" },
  { label: "Saving to Obsidian" },
  { label: "Indexing Hermes" }
];
var STAGE_INDEX = { "metadata": 0, "transcript": 0, "note": 1, "save": 2, "honcho": 3 };

function clearSuggestion() {
  suggestedCategory = null;
  applySuggestionRing();
}

function applySuggestionRing() {
  document.querySelectorAll(".scrape-pills .pill").forEach(function(x) {
    x.style.boxShadow = (suggestedCategory && x.dataset.v === suggestedCategory) ? "0 0 0 1px #8b5cf6" : "";
  });
  document.querySelectorAll(".scrape-suggest").forEach(function(el) {
    el.textContent = suggestedCategory
      ? "Suggested: " + (CATEGORY_LABELS[suggestedCategory] || suggestedCategory) : "";
  });
}

function setProcessEnabled(containerId, on) {
  var btn = document.getElementById(containerId + "-btn");
  if (!btn) return;
  btn.disabled = !on;
  btn.style.opacity = on ? "" : "0.5";
}

// Scrape form — the Home capture bar.
// Child ids are derived from containerId, so "home" yields #home-result.
function renderScrapeForm(containerId) {
  var wrap = document.getElementById(containerId);
  if (!wrap) return;
  if (document.getElementById(containerId + "-url")) return; // keep typed URL + last result
  var h = "<div style='background:#141418;border:1px solid #222228;border-radius:10px;padding:20px;margin-bottom:20px'>";
  h += "<div style='display:flex;gap:10px;align-items:center'>";
  h += "<input id='" + containerId + "-url' placeholder='Paste YouTube link...' style='flex:1;font-size:1rem;padding:12px 14px'>";
  h += "<button id='" + containerId + "-btn' class='btn btn-primary' style='padding:12px 20px;font-size:0.9rem;white-space:nowrap'>Process</button>";
  h += "</div>";
  h += "<div id='" + containerId + "-notice'></div>";
  h += "<div style='display:flex;align-items:baseline;gap:10px;margin:16px 0 6px'>";
  h += "<div style='font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:#555566;font-weight:600'>Save to:</div>";
  h += "<div class='scrape-suggest' id='" + containerId + "-suggest' style='font-size:0.7rem;color:#a47cf6'></div>";
  h += "</div>";
  h += "<div class='scrape-pills' id='" + containerId + "-pills' style='display:flex;gap:6px;flex-wrap:wrap'></div>";
  h += "</div>";
  h += "<div id='" + containerId + "-status'></div>";
  h += "<div id='" + containerId + "-result'></div>";
  wrap.innerHTML = h;
  renderPills(containerId + "-pills");
  document.getElementById(containerId + "-btn").onclick = function() {
    submitScrape(containerId);
  };
  var inp = document.getElementById(containerId + "-url");
  inp.onkeydown = function(e) {
    if (e.key === "Enter") { e.preventDefault(); submitScrape(containerId); }
  };
  inp.oninput = function() {
    if (checkTimer) clearTimeout(checkTimer);
    if ((inp.value || "").trim() !== lastCheckedUrl) {
      pasteDuplicate = null;
      pillTouched = false;
      renderPasteNotice(containerId, null);
      setProcessEnabled(containerId, true);
    }
    checkTimer = setTimeout(function() { checkPastedUrl(containerId); }, 500);
  };
}

// Debounced paste probe — flags duplicates and pre-selects a destination.
async function checkPastedUrl(containerId) {
  var inp = document.getElementById(containerId + "-url");
  if (!inp) return;
  var url = (inp.value || "").trim();
  if (!url || url === lastCheckedUrl) return;
  lastCheckedUrl = url;
  var d = await api("/api/check?url=" + encodeURIComponent(url));
  if ((inp.value || "").trim() !== url) return; // user kept typing
  if (!d || !d.valid) {
    pasteDuplicate = null;
    renderPasteNotice(containerId, null);
    setProcessEnabled(containerId, true);
    return;
  }
  if (d.duplicate) {
    pasteDuplicate = d.record || null;
    renderPasteNotice(containerId, pasteDuplicate);
    setProcessEnabled(containerId, false);
    return;
  }
  pasteDuplicate = null;
  renderPasteNotice(containerId, null);
  setProcessEnabled(containerId, true);
  if (!pillTouched && d.suggested_category && CATEGORIES.indexOf(d.suggested_category) >= 0) {
    suggestedCategory = d.suggested_category;
    applySuggestionRing();
  }
}

function renderPasteNotice(containerId, rec) {

  var h = "<div style='display:flex;align-items:center;gap:10px;font-size:0.78rem;color:#f59e0b;margin-top:10px'>";
  h += "<span>Already processed</span>";
  if (rec.path) {
    h += "<a class='rt-act' style='color:#a47cf6' href='" + viewUrl(rec.path) + "' target='_blank'>[Open]</a>";
  }
  h += "</div>";
  el.innerHTML = h;
}

function renderStages(containerId, activeIdx) {
  var el = document.getElementById(containerId + "-status");
  if (!el) return;
  var parts = [];
  STAGE_STEPS.forEach(function(s, i) {
    var cls = i < activeIdx ? "done" : (i === activeIdx ? "active" : "");
    parts.push("<span class='stage-step " + cls + "'>" + esc(s.label) + "</span>");
  });
  el.innerHTML = "<div style='background:#141418;border:1px solid #222228;border-radius:8px;padding:12px 16px;" +
    "margin-bottom:20px;font-size:0.78rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center'>" +
    parts.join("<span style='color:#333340'>&#8594;</span>") + "</div>";
}

async function submitScrape(containerId, retryUrl) {
  var input = document.getElementById(containerId + "-url");
  var btn = document.getElementById(containerId + "-btn");
  var res = document.getElementById(containerId + "-result");
  if (!input || !btn) return;
  var url = retryUrl || (input.value || "").trim();
  if (!url) { showToast("Paste a YouTube link first", "warning"); return; }
  if (!retryUrl && pasteDuplicate) { showToast("Already processed", "warning"); return; }
  var cat = selectedCategory;
  var catLabel = CATEGORY_LABELS[cat] || cat;
  btn.disabled = true;
  btn.textContent = "Processing...";
  if (res) res.innerHTML = "";
  var stageIdx = -1;
  renderStages(containerId, stageIdx);
  var done = null;
  try {
    await streamNdjson("/scrape", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url, category: cat })
    }, function(msg) {
      if (msg.type === "stage") {
        var i = STAGE_INDEX[msg.stage];
        if (typeof i === "number" && i > stageIdx) {
          stageIdx = i;
          renderStages(containerId, stageIdx);
        }
      } else if (msg.type === "done") {
        done = msg;
      }
    });
  } catch(e) {
    done = { ok: false, error: String(e) };
  }
  btn.disabled = false;
  btn.textContent = "Process";
  var status = document.getElementById(containerId + "-status");
  if (status) status.innerHTML = "";
  if (done && done.ok) {
    input.value = "";
    lastCheckedUrl = "";
    pasteDuplicate = null;
    pillTouched = false;
    clearSuggestion();
    renderPasteNotice(containerId, null);
    renderScrapeSuccess(containerId, done, catLabel);
    showToast("Added to " + catLabel, "success");
    var rd = await api("/recent");
    scrapesData = rd.scrapes || [];
    renderHomeRecent();
  } else if (done && done.duplicate) {
    pasteDuplicate = done.record || null;
    renderPasteNotice(containerId, pasteDuplicate);
    setProcessEnabled(containerId, false);
    showToast("Already processed", "warning");
  } else {
    var err = (done && done.error) || "Processing failed";
    renderScrapeFailure(containerId, stageIdx, err, url);
    showToast(err, "error");
  }
}

function renderScrapeSuccess(containerId, d, catLabel) {
  var res = document.getElementById(containerId + "-result");
  if (!res) return;
  var file = d.file || "";
  var title = d.title || cleanFileTitle(file.split("/").pop().replace(/\.md$/, ""));
  var h = "<div style='margin-bottom:20px'>";
  if (title) {
    h += "<div style='font-size:0.75rem;color:#88889a;margin-bottom:4px'>" + esc(title) + "</div>";
  }
  h += "<div style='display:flex;align-items:center;gap:10px;font-size:0.82rem'>";
  h += "<span style='color:#22c55e;font-weight:600'>&#10003; Added to " + esc(catLabel) + "</span>";
  if (file) {
    h += "<a class='rt-act' href='" + viewUrl(file) + "' target='_blank'>Open Note</a>";
  }
  h += "<span style='color:#333340'>&middot;</span>";
  h += "<a class='rt-act' href='" + escAttr(hermesUrl()) + "' target='_blank'>Ask Hermes</a>";
  h += "</div></div>";
  res.innerHTML = h;
}

function renderScrapeFailure(containerId, stageIdx, err, url) {
  var res = document.getElementById(containerId + "-result");
  if (!res) return;
  var head = "Processing failed";
  if (stageIdx === 3) head = "Hermes indexing failed";
  else if (stageIdx >= 0) head = STAGE_STEPS[stageIdx].label + " failed";
  var h = "<div style='background:#141418;border:1px solid #f87171;border-radius:8px;padding:16px;margin-bottom:20px'>";
  h += "<div style='font-weight:600;color:#f87171;margin-bottom:6px'>" + esc(head) + "</div>";
  h += "<div style='font-size:0.75rem;color:#88889a;white-space:pre-wrap;margin-bottom:10px'>" + esc(err) + "</div>";
  h += "<button class='btn btn-ghost' onclick='retryScrape(\"" + encodeURIComponent(containerId) + "\",\"" + encodeURIComponent(url) + "\")'>Retry</button>";
  h += "</div>";
  res.innerHTML = h;
}

function retryScrape(containerId, url) {
  submitScrape(decodeURIComponent(containerId), decodeURIComponent(url));
}

  moveItemId = id;

  html += "<div style='margin:12px 0'>Current: <strong>" + (CATEGORY_LABELS[cat] || cat) + "</strong></div>";

  var html = "<div style='display:flex;flex-direction:column;gap:8px'>";
  scrapesData.slice(0, 20).forEach(function(s) {
    html += "<div style='display:flex;align-items:center;gap:12px;padding:8px 12px;background:#141418;border-radius:6px'>";
    html += "<div style='flex:1'><div style='font-weight:500'>" + esc(s.title) + "</div><div style='font-size:0.75rem;color:#555566'>" + esc(s.channel) + " · " + s.date + "</div></div>";
    html += "<div style='font-size:0.7rem;color:#555566'>" + (CATEGORY_LABELS[s.category] || s.category) + "</div>";
    html += "</div>";
  });
  html += "</div>";
  document.getElementById("activity-load").innerHTML = html;
}

// ── Batch Import ───────────────────────────────────────────────
var BATCH_MAX = 20;
var batchItems = [];   // display model, one per submitted url
var batchRunning = false;

var BATCH_STATUS = {
  "queued":     { label: "Queued",     color: "#555566" },
  "processing": { label: "Processing", color: "#f59e0b" },
  "done":       { label: "Ready",      color: "#22c55e" },
  "failed":     { label: "Failed",     color: "#ef4444" },
  "skipped":    { label: "Skipped",    color: "#555566" }
};

async function loadImport() {
  await loadAppSettings();
  var el = document.getElementById("import-load");
  if (!el) return;
  var h = "<div style='background:#141418;border:1px solid #222228;border-radius:10px;padding:20px;margin-bottom:20px'>";
  h += "<textarea id='batch-urls' rows='7' style='width:100%' placeholder='Paste one YouTube URL per line...'></textarea>";
  h += "<div id='batch-counts' style='font-size:0.75rem;color:#555566;margin-top:8px'>0 valid links &middot; 0 duplicate &middot; 0 invalid</div>";
  h += "<div style='font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:#555566;font-weight:600;margin:16px 0 6px'>Save to:</div>";
  h += "<div class='scrape-pills' id='batch-pills' style='display:flex;gap:6px;flex-wrap:wrap'></div>";
  h += "<div style='margin-top:16px'><button id='batch-btn' class='btn btn-primary' style='padding:10px 18px'>Process 0 Videos</button></div>";
  h += "</div>";
  h += "<div id='batch-list'></div>";
  el.innerHTML = h;
  renderPills("batch-pills");
  document.getElementById("batch-urls").oninput = batchRecount;
  document.getElementById("batch-btn").onclick = function() {
    var parsed = batchParse();
    var urls = parsed.filter(function(p) { return p.valid && !p.duplicate; }).map(function(p) { return p.url; });
    if (!urls.length) { showToast("No new valid links", "warning"); return; }
    batchItems = parsed.map(function(p) {
      return {
        url: p.url,
        title: "",
        status: p.valid ? (p.duplicate ? "skipped" : "queued") : "skipped",
        reason: p.valid ? (p.duplicate ? "Already processed" : "") : "Not a YouTube URL"
      };
    });
    renderBatchList();
    batchRun(urls);
  };
  var d = await api("/recent");
  scrapesData = d.scrapes || [];
  batchRecount();
}

// Client-side pre-check. The backend re-validates and is authoritative.
function batchParse() {
  var ta = document.getElementById("batch-urls");
  var lines = ((ta && ta.value) || "").split("\n");
  var out = [];
  var seen = {};
  lines.forEach(function(raw) {
    var url = raw.trim();
    if (!url || out.length >= BATCH_MAX) return;
    var vid = extractVideoId(url);
    var valid = !!vid && isYoutubeHost(url);
    var dup = false;
    if (valid) {
      if (seen[vid]) dup = true;
      seen[vid] = true;
      if (!dup) dup = knownVideoId(vid);
    }
    out.push({ url: url, valid: valid, duplicate: dup, video_id: vid });
  });
  return out;
}

function knownVideoId(vid) {
  var hit = false;
  scrapesData.forEach(function(s) {
    if (hit || !vid) return;
    if (s.video_id === vid) hit = true;
    else if (s.url && s.url.indexOf(vid) >= 0) hit = true;
  });
  return hit;
}

function batchRecount() {
  var parsed = batchParse();
  var valid = 0, dup = 0, bad = 0;
  parsed.forEach(function(p) {
    if (!p.valid) bad++;
    else if (p.duplicate) dup++;
    else valid++;
  });
  var counts = document.getElementById("batch-counts");
  if (counts) {
    counts.textContent = valid + " valid link" + (valid === 1 ? "" : "s") +
      " · " + dup + " duplicate · " + bad + " invalid";
  }
  var btn = document.getElementById("batch-btn");
  if (btn && !batchRunning) {
    btn.textContent = "Process " + valid + " Video" + (valid === 1 ? "" : "s");
    btn.disabled = valid === 0;
    btn.style.opacity = valid === 0 ? "0.5" : "";
  }
}

function batchItemFor(url) {
  var found = null;
  batchItems.forEach(function(it) { if (!found && it.url === url) found = it; });
  return found;
}

async function batchRun(urls) {
  var btn = document.getElementById("batch-btn");
  batchRunning = true;
  if (btn) { btn.disabled = true; btn.textContent = "Processing..."; btn.style.opacity = "0.5"; }
  urls.forEach(function(u) {
    var it = batchItemFor(u);
    if (it) { it.status = "queued"; it.reason = ""; }
  });
  renderBatchList();
  try {
    await streamNdjson("/api/batch-scrape", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls: urls, category: selectedCategory })
    }, function(msg) {
      if (msg.type !== "item") return;
      var it = batchItemFor(urls[msg.index]);
      if (!it) return;
      if (msg.title) it.title = msg.title;
      if (msg.status === "invalid") { it.status = "skipped"; it.reason = msg.error || "Not a YouTube URL"; }
      else if (msg.status === "duplicate") { it.status = "skipped"; it.reason = "Already processed"; }
      else if (msg.status === "processing") { it.status = "processing"; it.reason = ""; }
      else if (msg.status === "done") { it.status = "done"; it.reason = ""; it.file = msg.file || ""; }
      else if (msg.status === "failed") { it.status = "failed"; it.reason = msg.error || "Failed"; }
      renderBatchList();
    });
  } catch(e) {
    urls.forEach(function(u) {
      var it = batchItemFor(u);
      if (it && (it.status === "queued" || it.status === "processing")) {
        it.status = "failed";
        it.reason = String(e);
      }
    });
  }
  batchItems.forEach(function(it) {
    if (it.status === "queued" || it.status === "processing") {
      it.status = "failed";
      it.reason = it.reason || "Stream ended before this item finished";
    }
  });
  batchRunning = false;
  renderBatchList();
  batchRecount();
  await reloadRecentData();
}

function retryBatchFailed() {
  if (batchRunning) return;
  var urls = [];
  batchItems.forEach(function(it) { if (it.status === "failed") urls.push(it.url); });
  if (!urls.length) { showToast("Nothing to retry", "warning"); return; }
  batchRun(urls.slice(0, BATCH_MAX));
}

function renderBatchList() {
  var el = document.getElementById("batch-list");
  if (!el) return;
  if (batchItems.length === 0) { el.innerHTML = ""; return; }
  var failed = 0;
  batchItems.forEach(function(it) { if (it.status === "failed") failed++; });
  var h = "<div style='display:flex;flex-direction:column;gap:6px'>";
  batchItems.forEach(function(it) {
    var b = BATCH_STATUS[it.status] || BATCH_STATUS.queued;
    h += "<div style='display:flex;align-items:center;gap:12px;padding:9px 12px;background:#141418;border:1px solid #222228;border-radius:6px'>";
    h += "<div style='flex:1;min-width:0'>";
    h += "<div style='font-size:0.8rem;color:#e8e8ed;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>" +
      esc(it.title || it.url) + "</div>";
    if (it.title) {
      h += "<div class='rt-sub' style='overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>" + esc(it.url) + "</div>";
    }
    if (it.reason) {
      h += "<div class='rt-sub' style='color:#7a6a45'>" + esc(it.reason) + "</div>";
    }
    h += "</div>";
    if (it.status === "done" && it.file) {
      h += "<a class='rt-act' href='" + viewUrl(it.file) + "' target='_blank'>Open Note</a>";
    }
    h += "<span class='badge' style='background:" + b.color + ";color:#fff'>" + esc(b.label) + "</span>";
    h += "</div>";
  });
  h += "</div>";
  if (failed > 0 && !batchRunning) {
    h += "<div style='margin-top:12px'><button class='btn btn-ghost' onclick='retryBatchFailed()'>Retry " +
      failed + " failed</button></div>";
  }
  el.innerHTML = h;
}

// Vault
async function loadVault() {
  var el = document.getElementById("vault-load");
  el.innerHTML = "<p style='color:#555566;font-size:0.82rem'>Loading vault...</p>";
  var d = await api("/api/vault");
  var cats = (d && d.categories) || [];
  if (cats.length === 0) {
    el.innerHTML = "<div class='empty-state'><h3>Vault unavailable</h3><p>" + esc((d && d.error) || "No categories returned.") + "</p></div>";
    return;
  }
  var html = "<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px'>";
  cats.forEach(function(c) {
    var files = c.files || [];
    var count = c.count || 0;
    html += "<div style='background:#141418;border:1px solid #222228;border-radius:8px;padding:16px'>";
    html += "<div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px'>";
    html += "<div style='font-weight:600'>" + esc(c.label) + "</div>";
    html += "<div style='font-size:0.7rem;color:#555566;white-space:nowrap'>" + count + " files</div>";
    html += "</div>";
    html += "<div style='font-size:0.72rem;color:#555566;margin:4px 0 10px'>" + esc(c.path) + "</div>";
    if (files.length === 0) {
      html += "<div style='font-size:0.78rem;color:#555566'>No notes yet</div>";
    } else {
      html += "<div style='display:flex;flex-direction:column;gap:5px'>";
      files.slice(0, 20).forEach(function(f) {
        html += "<a href='" + viewUrl(f.path) + "' target='_blank' style='font-size:0.78rem;color:#a47cf6'>" + esc(cleanFileTitle(f.title)) + "</a>";
      });
      html += "</div>";
      if (count > 20) {
        html += "<div style='font-size:0.7rem;color:#555566;margin-top:8px'>+ " + (count - 20) + " more</div>";
      }
    }
    html += "</div>";
  });
  html += "</div>";
  el.innerHTML = html;
}

// Memory
async function loadMemory() {
  var el = document.getElementById("memory-load");
  el.innerHTML = "<p style='color:#555566;font-size:0.82rem'>Loading memory status...</p>";
  var dbg = await api("/debug");
  var rec = await api("/recent");
  scrapesData = rec.scrapes || [];
  var ok = !!(dbg && dbg.honcho_ok);
  var html = "<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px'>";
  html += "<div style='background:#141418;border:1px solid #222228;border-radius:8px;padding:16px'>";
  html += "<div style='font-size:0.75rem;color:#555566;margin-bottom:4px'>Honcho</div>";
  html += "<div style='font-weight:600;color:" + (ok ? "#4ade80" : "#f87171") + "'>" + (ok ? "Connected" : "Unavailable") + "</div>";
  html += "<div style='font-size:0.72rem;color:#555566;margin-top:4px'>" + esc((dbg && dbg.honcho) || "?") + "</div>";
  html += "</div>";
  html += "<div style='background:#141418;border:1px solid #222228;border-radius:8px;padding:16px'>";
  html += "<div style='font-size:0.75rem;color:#555566;margin-bottom:4px'>Scrapes</div>";
  html += "<div style='font-size:1.5rem;font-weight:700'>" + ((dbg && dbg.scrape_count) || 0) + "</div>";
  html += "</div></div>";
  if (scrapesData.length === 0) {
    html += "<div class='empty-state'><h3>Nothing to sync</h3><p>Scrape a video to seed Honcho memory.</p></div>";
    el.innerHTML = html;
    return;
  }
  html += "<table><thead><tr><th>Title</th><th>Category</th><th>Sync</th><th></th></tr></thead><tbody>";
  scrapesData.forEach(function(s) {
    var st = s.honcho_sync_status || "synced";
    var color = st === "synced" ? "#22c55e" : st === "pending" ? "#f59e0b" : "#ef4444";
    html += "<tr><td style='color:#e8e8ed'>" + esc(s.title) + "</td>";
    html += "<td>" + esc(CATEGORY_LABELS[s.category] || s.category) + "</td>";
    html += "<td><span style='display:inline-block;padding:2px 10px;border-radius:100px;font-size:0.7rem;font-weight:600;background:" + color + ";color:#fff'>" + esc(st) + "</span></td>";
    html += "<td>";
    if (st !== "synced") {
      html += "<button class='btn btn-ghost' onclick='retryHonchoSync(\"" + encodeURIComponent(s.id) + "\")'>Retry</button>";
    }
    html += "</td></tr>";
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

// id arrives already URL-encoded from the onclick attribute, so it drops straight into the path
async function retryHonchoSync(id) {
  var d = await api("/api/items/" + id + "/honcho-sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });
  if (d && d.success) {
    showToast("Synced to Honcho", "success");
  } else {
    showToast((d && d.error) || "Sync failed", "error");
  }
  loadMemory();
}

// Tags placeholder
function loadTags() {
  document.getElementById("tag-grid").innerHTML = "<div class='empty-state'><p>Tags coming soon</p></div>";
}

// Helper
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

// esc() leaves quotes alone; attribute values need them escaped too.
function escAttr(s) {
  return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

document.addEventListener("DOMContentLoaded", function() {
  handleHash();
  window.addEventListener("hashchange", handleHash);
  document.addEventListener("click", function(e) {
    if (!e.target.closest || !e.target.closest(".rt-menu-wrap")) closeRowMenus();
    if (!e.target.closest || !e.target.closest(".sidebar-footer")) closeHealthDetail();
  });
  loadHome();
  loadHealth();
  setInterval(loadHealth, 30000);
});
